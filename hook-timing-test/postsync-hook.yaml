apiVersion: batch/v1
kind: Job
metadata:
  name: hook-timing-postsync
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: probe
          image: busybox:1.36
          command: ["sh", "-c", "echo \"POSTSYNC_FIRED_AT=$(date -u +%s)\""]
