apiVersion: batch/v1
kind: Job
metadata:
  name: platform-outcome-syncfail
  annotations:
    argocd.argoproj.io/hook: SyncFail
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
  labels:
    platform.io/app: cicd-flow-test-app
    platform.io/subcomponent: outcome-hook
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 60
  template:
    spec:
      serviceAccountName: platform-outcome-hook
      restartPolicy: Never
      containers:
        - name: notify
          image: ghcr.io/jfillman/platform-cicd-toolbox:latest
          command: ["/opt/platform/lib/argocd-outcome-hook.sh"]
          env:
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - { name: RELAY_URL, value: "http://10.89.0.2:30880/outcome/kind-prod" }
            - { name: APP_NAMESPACE, value: "app-cicd-flow-test-app-cicd" }
            - { name: APP_NAME, value: "cicd-flow-test-app" }
            - { name: ENV, value: "staging" }
            - { name: PHASE, value: "Failed" }
            - { name: GIT_URL, value: "https://github.com/jfillman/cicd-flow-test-app" }
            - { name: GIT_REVISION, value: "3f844e6cbb069259d92a388160e628be507d755c" }
            - { name: FLOW_START_TIME, value: "2026-08-12T21:22:52.289574245Z" }
            - { name: CHAIN_ID, value: "d3af4efe-7391-412c-8678-0d906b254df5" }
            - { name: PR_URL, value: "https://github.com/jfillman/gitops-cicd-flow-test-app/pull/176" }
            - { name: PR_CREATED_AT, value: "2026-08-12T21:24:05.361170224Z" }
            - { name: CONFIG_JSON_B64, value: "" }
