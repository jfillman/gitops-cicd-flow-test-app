apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-flow-test-app
  namespace: app-cicd-flow-test-app-staging
  annotations:
    platform.io/dora-git-revision: 92569c8a608c5307f562ed6ef36ec4a7104aa0b8
    platform.io/dora-image: ghcr.io/jfillman/cicd-flow-test-app:1.0.16-92569c8
    platform.io/dora-flow-start-time: "2026-08-12T19:18:35.633005432Z"
    platform.io/dora-gitops-pr-url: https://github.com/jfillman/gitops-cicd-flow-test-app/pull/174
spec:
  replicas: 1
  selector:
    matchLabels: {app: cicd-flow-test-app}
  template:
    metadata:
      labels: {app: cicd-flow-test-app}
    spec:
      containers:
        - name: cicd-flow-test-app
          image: ghcr.io/jfillman/cicd-flow-test-app:1.0.17-60e31ef # placeholder - patched by release.yaml's open-release-pr Task
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: {path: /healthz, port: 3000}
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: 3000}
            initialDelaySeconds: 3
