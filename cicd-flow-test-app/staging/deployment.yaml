    platform.io/dora-image: ghcr.io/jfillman/cicd-flow-test-app:1.0.12-501bdfc
    platform.io/dora-flow-start-time: "2026-08-12T07:30:04.056594261Z"
    platform.io/dora-gitops-pr-url: https://github.com/jfillman/gitops-cicd-flow-test-app/pull/164
spec:
