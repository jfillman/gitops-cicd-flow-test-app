apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-flow-test-app
  namespace: app-cicd-flow-test-app-staging
  annotations:
    platform.io/dora-git-revision: fa017bc351251ba5a8c2548850f434693740e4f2
    platform.io/dora-image: ghcr.io/jfillman/cicd-flow-test-app:1.0.12-fa017bc
    platform.io/dora-flow-start-time: "2026-08-12T07:32:13.094618026Z"
    platform.io/dora-gitops-pr-url: https://github.com/jfillman/gitops-cicd-flow-test-app/pull/165
spec:
  replicas: 1
  selector:
    matchLabels: {app: cicd-flow-test-app}
  template:
    metadata:
      labels: {app: cicd-flow-test-app}
    spec:
      containers:
        - name: cicd-flow-test-app
          image: ghcr.io/jfillman/cicd-flow-test-app:1.0.12-fa017bc # placeholder - patched by release.yaml's open-release-pr Task
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet: {path: /healthz, port: 3000}
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: 3000}
            initialDelaySeconds: 3
